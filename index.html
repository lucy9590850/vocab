<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>單字練習站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: playful app shell — sunny header with points, colored grade tabs, lesson chips, then 學習/檢測/單字集; one column ~720px. Each grade tints the accent. */
:root{
  --bg:#fff7ec; --surface:#ffffff; --sunk:#fdeedd; --ink:#3b2a1e; --muted:#8a6d58; --line:#f1dcc4;
  --g7:#25a566; --g7-soft:#e2f6ea; --g8:#f0712c; --g8-soft:#ffe9da; --g9:#6f58f0; --g9-soft:#ece8ff; --g12:#e2477f; --g12-soft:#fde4ee;
  --accent:var(--g8); --accent-soft:var(--g8-soft); --on-accent:#ffffff;
  --sun:#ffc83a; --gold:#a8650a; --gold-soft:#fff0c4; --ok:#18905c; --ok-soft:#dcf5e8; --bad:#d9383f; --bad-soft:#ffe3e1;
  --shadow:rgba(150,90,40,.16);
  color-scheme:light;
  --display:"Baloo 2","Huninn","Noto Sans TC",system-ui,sans-serif;
  --round:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,sans-serif;
}
body[data-grade="7"]{--accent:var(--g7);--accent-soft:var(--g7-soft)}
body[data-grade="8"]{--accent:var(--g8);--accent-soft:var(--g8-soft)}
body[data-grade="9"]{--accent:var(--g9);--accent-soft:var(--g9-soft)}
body[data-grade="1200"]{--accent:var(--g12);--accent-soft:var(--g12-soft)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(circle at 1px 1px,var(--line) 1.2px,transparent 0);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--round);font-weight:400}
h1{font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1.1}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sun);color:#3b2a1e;
  border-radius:22px;padding:14px 18px;box-shadow:0 5px 0 rgba(168,101,10,.35);position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.28);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.logo{width:46px;height:46px;flex:none;border-radius:14px;background:#fff;display:grid;place-items:center;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:1.25rem;color:#f0712c;transform:rotate(-6deg);box-shadow:0 3px 0 rgba(168,101,10,.35)}
.brand-text{display:flex;flex-direction:column}
.brand-text span{font-size:.85rem;opacity:.75}
.points{position:relative;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#a8650a;font-family:"Baloo 2",var(--body);font-weight:800;font-size:1.05rem;
  padding:4px 14px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(168,101,10,.3)}
.points.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25) rotate(-4deg)}60%{transform:scale(.95)}}

/* grade tabs */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px 6px 9px;
  display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.25;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.grade b{font-family:var(--round);font-weight:400;font-size:1.05rem}
.grade small{color:var(--muted);font-size:.72rem}
.grade:hover{transform:translateY(-2px)}
.grade[data-g="7"]{--c:var(--g7)}.grade[data-g="8"]{--c:var(--g8)}.grade[data-g="9"]{--c:var(--g9)}.grade[data-g="1200"]{--c:var(--g12)}
.grade[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--on-accent);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000)}
.grade[aria-selected="true"] small{color:var(--on-accent);opacity:.85}
@media (max-width:440px){.grade b{font-size:.85rem;white-space:nowrap}.grade small{font-size:.64rem}.grades{gap:6px}.grade{padding:8px 2px 9px}}

/* lesson chips */
.lessons{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.lessons:empty{display:none}
.lesson{font:inherit;flex:none;display:flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lesson span{font-weight:700}
.lesson small{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.lesson:hover{border-color:var(--accent)}
.lesson[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.lesson[aria-pressed="true"] small{color:var(--accent)}

/* section tabs */
nav{display:flex;gap:4px;background:var(--sunk);padding:5px;border-radius:16px}
nav button{flex:1;font:inherit;font-family:var(--round);font-size:1.02rem;border:0;background:none;color:var(--muted);padding:8px;border-radius:12px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 2px 0 var(--line)}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 18px -10px var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

button.btn,label.btn,a.btn{font:inherit;font-weight:700;padding:9px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:hover{border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.hint{background:var(--gold-soft);border-color:var(--sun);color:var(--gold);box-shadow:0 3px 0 var(--sun)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label.btn:focus-within,a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon-btn{font:inherit;width:40px;height:40px;flex:none;border-radius:50%;border:2px solid transparent;background:var(--accent-soft);color:var(--accent);cursor:pointer;display:inline-grid;place-items:center;transition:transform .12s}
.icon-btn:hover{border-color:var(--accent);transform:scale(1.08)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
textarea{width:100%;min-height:150px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.9rem;line-height:1.5}

/* empty grade */
.empty{align-items:center;text-align:center;padding:32px 20px}
.empty .badge{width:84px;height:84px;border-radius:26px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"Baloo 2",var(--round);font-weight:800;font-size:1.9rem;transform:rotate(-5deg)}
.empty p{max-width:44ch;margin:0}
.steps{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--sunk);border-radius:14px;padding:12px 16px;margin:0;max-width:46ch}

/* learn */
.words{display:flex;flex-direction:column}
.word-row{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:12px 0;border-top:2px dashed var(--line)}
.word-row:first-child{border-top:0}
.word-row .icon-btn{grid-row:span 2;margin-top:2px}
.word-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.word-en{font-family:"Baloo 2",var(--body);font-size:1.45rem;font-weight:700;line-height:1.3;word-break:break-word}
.word-zh{color:var(--muted)}
.word-full{grid-column:2;margin:0;font-size:.82rem;color:var(--muted);line-height:1.5}
details.ex{min-width:0}
details.ex summary{cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:700;width:max-content}
.ex-body{display:flex;gap:10px;align-items:flex-start;margin-top:8px;background:var(--sunk);border-radius:14px;padding:10px 12px}
.ex-body p{margin:0;min-width:0}
.ex-body mark{background:var(--sun);color:#3b2a1e;padding:0 4px;border-radius:6px}
.ex-body .icon-btn{width:34px;height:34px}
.ex-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.ex-text .tr{color:var(--muted);font-size:.9rem}

/* quiz setup */
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.type{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.type:hover:not(:disabled){transform:translateY(-2px)}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.type:disabled{opacity:.45;cursor:not-allowed}
.type-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.type-name{font-family:var(--round);font-size:1.08rem}
.pts{font-size:.8rem;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:2px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.type .small{color:var(--muted)}

/* quiz run */
.q-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.bar{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s cubic-bezier(.3,1.5,.6,1);
  background-image:linear-gradient(90deg,rgba(255,255,255,.35) 0 50%,transparent 50%);background-size:16px 100%}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.prompt .big{font-family:"Baloo 2",var(--body);font-size:clamp(2rem,8vw,2.8rem);font-weight:800;line-height:1.1;word-break:break-word;color:var(--accent)}
.prompt .zh{font-family:var(--round);font-size:1.7rem}
.listen-big{width:82px;height:82px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 35%,transparent)}
.listen-big svg{width:34px;height:34px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-family:"Baloo 2",var(--body);font-size:1.2rem;font-weight:700;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;word-break:break-word;box-shadow:0 3px 0 var(--line)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok);animation:pop .4s}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.spell{display:flex;gap:10px}
.spell input{flex:1;font-size:1.25rem;letter-spacing:.05em;text-align:center}
.slots{font-family:ui-monospace,Menlo,monospace;letter-spacing:.3em;color:var(--muted);font-size:1.1rem}
.tray{min-height:58px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.tray.bank{border-style:solid;background:var(--sunk)}
.tok{font:inherit;font-weight:500;padding:5px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.tok:hover:not(:disabled){border-color:var(--accent)}
.tr-prompt{color:var(--muted);font-size:.9rem;max-width:46ch}
.feedback{border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;animation:pop .35s}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback strong{font-family:var(--round);font-weight:400;font-size:1.1rem}
.feedback .ans{color:var(--ink);font-weight:500}
.mic.listening{animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 30%,transparent)}}
.status{text-align:center;color:var(--muted);min-height:1.6em}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* results */
.score-big{font-family:"Baloo 2",var(--body);font-size:3.4rem;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:1.25rem}
.review{display:flex;flex-direction:column;gap:6px}
.review-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.review-panel{border-color:var(--sun);background:linear-gradient(var(--gold-soft),var(--surface) 80px)}
.send{border-top:2px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.send textarea{min-height:170px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20}

/* sets */
.set-item{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:2px dashed var(--line)}
.set-item:first-of-type{border-top:0}
.set-item .current{font-size:.8rem;color:var(--ok);font-weight:700}
.format{background:var(--sunk);border-radius:12px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;overflow-x:auto;white-space:pre;margin:0}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:.9rem;max-width:calc(100% - 32px);z-index:30}

@media (max-width:440px){.options{grid-template-columns:1fr}.panel{padding:16px}h1{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* header: me chip */
.me{position:relative;display:flex;align-items:center;gap:10px}
.me:empty{display:none}
.me-btn{font:inherit;display:flex;align-items:center;gap:10px;background:#fff;border:0;border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;color:#3b2a1e;box-shadow:0 3px 0 rgba(168,101,10,.3);text-align:left}
.me-btn .av{width:42px;height:42px}
.me-info{display:flex;flex-direction:column;line-height:1.25}
.me-info b{font-weight:700;font-size:.92rem}
.me-info span{font-size:.8rem;color:#8a5a1a;font-variant-numeric:tabular-nums;display:flex;gap:10px}
.me-btn.bump{animation:bump .5s}
.av{display:block;border-radius:50%;flex:none}
.av svg{display:block;width:100%;height:100%}

/* login */
.login{gap:18px}
.login-hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.login-hero .av{width:120px;height:120px;box-shadow:0 5px 0 var(--line)}
.pick-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pick{font:inherit;cursor:pointer;background:var(--surface);border:3px solid var(--line);border-radius:50%;padding:3px;width:72px;height:72px}
.pick .av{width:100%;height:100%}
.pick[aria-pressed="true"]{border-color:var(--accent);transform:scale(1.08)}
.form-grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}
.form-grid>*{min-width:0}.form-grid input{width:100%}
[hidden]{display:none!important}
@media (max-width:480px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .wide{grid-column:span 2}}
.today{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.who-list{display:flex;flex-wrap:wrap;gap:8px}
.who{font:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.who .av{width:34px;height:34px}
.who:hover{border-color:var(--accent)}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:0}

/* style tab */
.profile{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.profile .av{width:132px;height:132px;box-shadow:0 5px 0 var(--line)}
@media (max-width:440px){.profile{grid-template-columns:1fr;justify-items:center;text-align:center}}
.p-name{font-family:var(--round);font-size:1.45rem}
.p-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
@media (max-width:440px){.p-stats{justify-content:center}}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.85rem;padding:3px 11px;border-radius:999px;background:var(--sunk);font-variant-numeric:tabular-nums}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill svg{width:16px;height:16px}
.slots-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.slot-tab{font:inherit;flex:none;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700}
.slot-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.item{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:0 3px 0 var(--line);position:relative;text-align:center}
.item .av{width:76px;height:76px}
.item .nm{font-weight:700;font-size:.92rem;line-height:1.25}
.item .st{font-size:.76rem;color:var(--muted);font-weight:700}
.item.wearing{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.item.wearing .st{color:var(--accent)}
.item.buy .st{color:var(--gold)}
.item.locked{cursor:default}
.item.locked .av{filter:grayscale(1) brightness(.85);opacity:.55}
.item.confirm{border-color:var(--sun);background:var(--gold-soft)}
.rar{position:absolute;top:6px;left:6px;font-family:"Baloo 2",var(--body);font-weight:800;font-size:.66rem;line-height:1;padding:3px 6px;border-radius:6px;color:#fff}
.rar.N{background:#8fa3b8}.rar.R{background:#3b9ad9}.rar.SR{background:#9a5cf0}.rar.SSR{background:linear-gradient(90deg,#f0712c,#e2477f,#9a5cf0)}.rar.UR{background:repeating-linear-gradient(135deg,#b5262c 0 5px,#1f1a1a 5px 7px,#b5262c 7px 12px);box-shadow:0 0 0 1.5px #f2c14e}

/* draw tab */
.tickets-hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tickets-hero .big-ticket{width:64px;height:64px;color:var(--accent)}
.tickets-hero b{font-family:"Baloo 2",var(--body);font-size:2.2rem;line-height:1;color:var(--accent)}
.machines{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.machine{display:flex;flex-direction:column;gap:8px;align-items:stretch;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 3px 0 var(--line)}
.machine .mini{height:150px;display:grid;place-items:center;border-radius:14px;background:var(--sunk);overflow:hidden}
.machine h3{text-align:center}
.machine p{margin:0;text-align:center;font-size:.85rem;color:var(--muted)}
.odds{font-size:.8rem;color:var(--muted);text-align:center}

/* stage overlay */
.stage-wrap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(40,26,16,.62);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.stage{width:min(360px,100%);background:var(--surface);border-radius:26px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18);animation:pop .3s}
.stage .scene{width:260px;height:260px;max-width:100%;position:relative}
.reveal .av{width:150px;height:150px;animation:pop .5s}
.reveal .rar{position:static;font-size:.9rem;padding:4px 10px}
.reveal h2{font-size:1.5rem}
.glow{position:relative}
.glow::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:conic-gradient(from 0deg,var(--sun),transparent 20%,var(--sun) 40%,transparent 60%,var(--sun) 80%,transparent);opacity:.55;animation:spin 6s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}

/* claw machine */
.claw-m{position:absolute;inset:0;display:flex;flex-direction:column}
.claw-glass{position:relative;flex:1;border:6px solid var(--g12);border-bottom:0;border-radius:20px 20px 0 0;background:linear-gradient(#e9f7ff,#cdeeff);overflow:hidden}
.claw-rail{position:absolute;top:10px;left:8px;right:8px;height:6px;border-radius:3px;background:#9aa8b8}
.claw{position:absolute;top:12px;left:24px;width:44px;display:flex;flex-direction:column;align-items:center}
.claw .cable{width:3px;height:26px;background:#6b7787}
.claw .head{width:26px;height:12px;border-radius:6px 6px 3px 3px;background:#6b7787}
.claw .fingers{position:relative;width:40px;height:22px}
.claw .fingers i{position:absolute;top:0;width:5px;height:22px;background:#6b7787;border-radius:3px}
.claw .fingers i:first-child{left:6px;transform-origin:top;transform:rotate(22deg)}
.claw .fingers i:last-child{right:6px;transform-origin:top;transform:rotate(-22deg)}
.claw .caught{position:absolute;top:58px;width:34px;height:34px;border-radius:50%;opacity:0}
.plushes{position:absolute;left:0;right:0;bottom:0;height:70px}
.plushes i{position:absolute;bottom:0;width:38px;height:38px;border-radius:50%;box-shadow:inset -5px -6px 0 rgba(0,0,0,.12)}
.claw-base{height:54px;background:var(--g12);border-radius:0 0 16px 16px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.chute{width:52px;height:30px;border-radius:8px;background:rgba(0,0,0,.25)}
.claw-btn{width:30px;height:30px;border-radius:50%;background:var(--sun);box-shadow:0 4px 0 #b88a10}
.run .claw{animation:clawRun 3s ease-in-out forwards}
.run .claw .fingers i:first-child{animation:gripL 3s forwards}
.run .claw .fingers i:last-child{animation:gripR 3s forwards}
.run .claw .caught{animation:caught 3s forwards}
@keyframes clawRun{0%{transform:translate(0,0)}22%{transform:translate(118px,0)}42%{transform:translate(118px,118px)}55%{transform:translate(118px,118px)}75%{transform:translate(118px,0)}92%,100%{transform:translate(0,0)}}
@keyframes gripL{0%,46%{transform:rotate(22deg)}52%,100%{transform:rotate(-6deg)}}
@keyframes gripR{0%,46%{transform:rotate(-22deg)}52%,100%{transform:rotate(6deg)}}
@keyframes caught{0%,50%{opacity:0}52%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(90px)}}

/* capsule machine */
.gacha-m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.dome{position:relative;width:190px;height:150px;border-radius:95px 95px 18px 18px;background:radial-gradient(circle at 35% 30%,#ffffffcc,#d8f1ff 55%);border:6px solid var(--g9);overflow:hidden}
.dome i{position:absolute;width:40px;height:40px;border-radius:50%;background:linear-gradient(var(--c) 50%,#fff 50%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.gbody{width:210px;height:96px;background:var(--g9);border-radius:12px 12px 22px 22px;position:relative}
.knob{position:absolute;left:30px;top:22px;width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid var(--sun)}
.knob::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:8px;margin-left:-4px;border-radius:4px;background:var(--sun)}
.gslot{position:absolute;right:30px;top:28px;width:58px;height:40px;border-radius:10px;background:rgba(0,0,0,.28)}
.cap-out{position:absolute;right:52px;top:186px;width:44px;height:44px;opacity:0}
.cap-out i{position:absolute;left:0;width:44px;height:22px}
.cap-out i:first-child{top:0;border-radius:22px 22px 0 0;background:var(--c)}
.cap-out i:last-child{bottom:0;border-radius:0 0 22px 22px;background:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.run .knob{animation:knob 1.3s ease-in-out forwards}
.run .dome i{animation:jiggle .35s 3 alternate}
.run .cap-out{animation:capDrop 1.1s 1.3s cubic-bezier(.3,1.6,.5,1) forwards}
.run .cap-out i:first-child{animation:capTop .6s 2.6s forwards}
.run .cap-out i:last-child{animation:capBot .6s 2.6s forwards}
@keyframes knob{to{transform:rotate(720deg)}}
@keyframes jiggle{to{transform:translate(3px,-4px) rotate(8deg)}}
@keyframes capDrop{0%{opacity:1;transform:translate(0,-30px) scale(.6)}100%{opacity:1;transform:translate(-60px,20px) scale(1.3)}}
@keyframes capTop{to{transform:translate(-10px,-30px) rotate(-30deg)}}
@keyframes capBot{to{transform:translate(8px,10px) rotate(12deg)}}

/* treasure chest */
.chest-m{position:absolute;inset:0;display:grid;place-items:center}
.rays{position:absolute;width:240px;height:240px;border-radius:50%;background:repeating-conic-gradient(var(--sun) 0 12deg,transparent 12deg 30deg);opacity:0}
.chest{position:relative;width:170px;height:130px;margin-top:40px}
.chest .box{position:absolute;bottom:0;left:0;right:0;height:84px;background:#b8743a;border-radius:6px 6px 14px 14px;border:5px solid #7a4a20}
.chest .box::before{content:"";position:absolute;left:-5px;right:-5px;top:22px;height:12px;background:var(--sun)}
.chest .lock{position:absolute;left:50%;top:12px;width:28px;height:34px;margin-left:-14px;background:var(--sun);border-radius:6px;border:4px solid #b88a10;z-index:1}
.chest .lid{position:absolute;bottom:80px;left:0;right:0;height:52px;background:#c98446;border:5px solid #7a4a20;border-radius:60px 60px 6px 6px;transform-origin:10% 100%}
.chest .lid::after{content:"";position:absolute;left:-5px;right:-5px;bottom:8px;height:10px;background:var(--sun)}
.run .chest{animation:chestShake 1.4s ease-in-out}
.run .chest .lid{animation:lidOpen .6s 1.5s cubic-bezier(.3,1.6,.5,1) forwards}
.run .rays{animation:rays 1.2s 1.6s forwards}
@keyframes chestShake{0%,100%{transform:rotate(0)}10%,30%,50%,70%{transform:rotate(-5deg)}20%,40%,60%,80%{transform:rotate(5deg)}}
@keyframes lidOpen{to{transform:rotate(-38deg) translate(-6px,-14px)}}
@keyframes rays{0%{opacity:0;transform:scale(.4) rotate(0)}100%{opacity:.75;transform:scale(1.1) rotate(60deg)}}

/* art + book + tappable words */
.av canvas{display:block;width:100%;height:100%;image-rendering:pixelated;border-radius:50%}
.av.ghost svg,.av.ghost canvas{filter:grayscale(1) brightness(.45) contrast(.7);opacity:.3}
.art-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:440px){.art-row{justify-content:center}}
.art-btn{font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:5px 6px 3px;color:var(--ink);font-size:.78rem;font-weight:700}
.art-btn .av{width:40px;height:40px}
.art-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.view-tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:14px}
.view-tab{flex:1;font:inherit;font-family:var(--round);font-size:1.05rem;border:0;background:none;color:var(--muted);padding:8px;border-radius:10px;cursor:pointer}
.view-tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 2px 0 var(--line)}
.book-wrap{display:flex;flex-direction:column;gap:16px}
.book-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.book-count{font-family:"Baloo 2",var(--body);font-weight:800;font-size:2.2rem;color:var(--accent);line-height:1}
.ms-row{display:flex;gap:8px;overflow-x:auto;padding:6px 6px 8px}
.ms{font:inherit;flex:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 12px;border-radius:14px;border:2px dashed var(--line);background:var(--surface);color:var(--muted);line-height:1.3}
.ms b{font-size:.85rem}.ms span{font-size:.75rem}
.ms.ready{border:2px solid var(--sun);background:var(--gold-soft);color:var(--gold);cursor:pointer;box-shadow:0 3px 0 var(--sun);animation:msGlow 1.4s ease-in-out infinite}
@keyframes msGlow{50%{box-shadow:0 3px 0 var(--sun),0 0 0 5px color-mix(in srgb,var(--sun) 45%,transparent)}}
.ms.done{border-style:solid;color:var(--ok);background:var(--ok-soft)}
.ms:disabled{cursor:default}
.book-sec{display:flex;flex-direction:column;gap:10px}
.item.book{cursor:default;padding:8px 4px}
.book-sec .items{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.item.book .av{width:58px;height:58px}
.item.book .nm{font-size:.85rem}.item.book .st{font-size:.7rem;line-height:1.3}
.item.book.missing .nm{color:var(--muted)}
.tap-sent{line-height:1.9}
.wtok{font:inherit;background:none;border:0;padding:0 1px;margin:0;border-radius:5px;color:inherit;cursor:pointer;border-bottom:1.5px dotted var(--line)}
.wtok:hover,.wtok:focus-visible{background:var(--accent-soft);color:var(--accent);outline:none}
.wtok.hit{background:var(--sun);color:#3b2a1e;padding:0 4px;border-bottom:0}
@media (prefers-reduced-motion:reduce){.ms.ready{animation:none}}

/* cloud + plaza */
.cloud-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;background:var(--sunk);border-radius:14px;padding:8px 12px;text-align:left}
.cloud-box.setup{flex-direction:column;align-items:stretch;gap:8px;background:var(--gold-soft);border:2px solid var(--sun)}
.cloud-box .err{min-height:0}
.cloud-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.cloud-dot.syncing{background:var(--sun)}.cloud-dot.net,.cloud-dot.locked{background:var(--muted)}.cloud-dot.pin{background:var(--bad)}
.plaza-scene{border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#a9dd8f}
.plaza-scene .sky{position:relative;height:88px;background:linear-gradient(#9fd8ff,#d6f0ff)}
.plaza-scene .sun{position:absolute;right:22px;top:14px;width:40px;height:40px;border-radius:50%;background:#ffd86b;box-shadow:0 0 0 8px rgba(255,216,107,.35)}
.plaza-scene .cloud{position:absolute;height:18px;border-radius:10px;background:#fff;opacity:.9}
.plaza-scene .cloud::before{content:"";position:absolute;left:12px;top:-10px;width:26px;height:24px;border-radius:50%;background:#fff}
.plaza-scene .c1{left:8%;top:22px;width:62px;animation:drift 18s linear infinite alternate}
.plaza-scene .c2{left:44%;top:40px;width:48px;animation:drift 24s linear infinite alternate-reverse}
@keyframes drift{to{transform:translateX(40px)}}
.plaza-scene .tree{position:absolute;bottom:-6px;width:34px;height:34px;border-radius:50%;background:#5dbb63;box-shadow:12px 6px 0 -2px #4fa856}
.plaza-scene .tree::after{content:"";position:absolute;left:14px;top:30px;width:7px;height:12px;background:#9a6a3a}
.plaza-scene .t1{left:4%}.plaza-scene .t2{left:30%;transform:scale(.8)}.plaza-scene .t3{right:20%;transform:scale(.9)}
.plaza-scene .ground{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:18px 6px;padding:22px 10px 20px;
  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.35) 1.5px,transparent 0) 0 0/18px 18px,linear-gradient(#a9dd8f,#93d07a)}
.dweller{font:inherit;position:relative;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;color:#3b2a1e;
  transform:translateY(var(--dy));animation:bob 2.4s ease-in-out var(--dl) infinite}
.dweller .av{width:58px;height:58px;box-shadow:0 6px 0 -2px rgba(0,0,0,.15)}
.dweller .tag{font-size:.72rem;font-weight:700;background:rgba(255,255,255,.88);padding:1px 7px;border-radius:999px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dweller.me .av{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent)}
.dweller.picked .tag{background:var(--accent);color:var(--on-accent)}
.dweller .you{position:absolute;top:-12px;z-index:1;background:var(--accent);color:var(--on-accent);font-size:.7rem;font-weight:800;padding:0 7px;border-radius:999px}
.dweller:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:12px}
@keyframes bob{50%{transform:translateY(calc(var(--dy) - 4px))}}
.pick-card{display:flex;flex-direction:column;gap:10px;background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.pick-info{display:flex;align-items:center;gap:12px}
.pick-info .av{width:56px;height:56px}
.picker{display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px;width:100%}
.phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;width:100%}
.phrase{display:flex;align-items:center;gap:6px;min-width:0}
.phrase .icon-btn{width:34px;height:34px}
.ph-send{font:inherit;flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:0;padding:7px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.ph-send:hover{border-color:var(--accent)}
.ph-send b{font-family:"Baloo 2",var(--body);font-size:1rem;line-height:1.3}
.ph-send span{font-size:.8rem;color:var(--muted)}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.move{font:inherit;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.move:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.mv-e{font-size:1.9rem;line-height:1.2}
.move b{font-family:"Baloo 2",var(--body)}.move span:last-child{font-size:.78rem;color:var(--muted)}
.small-moves .mv-e{font-size:1.5rem}
.bubble{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);z-index:2;background:#fff;color:#3b2a1e;border:2px solid #3b2a1e;border-radius:12px;padding:2px 8px;font-family:"Baloo 2",var(--body);font-weight:700;font-size:.74rem;line-height:1.25;width:max-content;max-width:120px;white-space:normal;cursor:pointer;animation:pop .35s}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#3b2a1e}
.bubble small{font-weight:500;color:#8a6d58}
.plaza-scene .ground{row-gap:44px!important;padding:44px 20px 20px!important}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{border-radius:14px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.msg.in{background:var(--accent-soft)}
.msg.hot{background:var(--gold-soft);border:2px solid var(--sun)}
.msg.win{background:var(--ok-soft)}.msg.lose{background:var(--bad-soft)}
.m-line{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:700}
.ago{color:var(--muted);font-weight:500;font-size:.78rem;white-space:nowrap}
.m-say{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-say .icon-btn{width:32px;height:32px}
.m-say b{font-family:"Baloo 2",var(--body);font-size:1.05rem}
.m-replies{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip-btn{font:inherit;font-family:"Baloo 2",var(--body);font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:999px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
.chip-btn:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.m-rps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:"Baloo 2",var(--body);font-size:1.05rem}
.m-rps b{margin-left:auto;font-family:var(--round);font-weight:400}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.board ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:r}
.board li{display:flex;align-items:center;gap:8px;counter-increment:r;background:var(--sunk);border-radius:12px;padding:4px 10px 4px 6px}
.board li::before{content:counter(r);font-family:"Baloo 2",var(--body);font-weight:800;color:var(--accent);width:1.2em;text-align:center}
.board li.me{background:var(--accent-soft)}
.board li .av{width:30px;height:30px}
.board .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.board b{font-variant-numeric:tabular-nums;font-size:.9rem}
@media (max-width:440px){nav button{font-size:.86rem;padding:8px 0}}
@media (prefers-reduced-motion:reduce){.dweller,.plaza-scene .cloud{animation:none}}

/* atayal + seasons */
.glow.ur::before{background:conic-gradient(from 0deg,#b5262c,transparent 20%,#f2c14e 40%,transparent 60%,#b5262c 80%,transparent)}
.culture-note{margin:0;max-width:30ch;font-size:.88rem;color:var(--ink);background:var(--gold-soft);border-radius:12px;padding:8px 12px;text-align:left}
details.culture{width:100%;text-align:left}
details.culture summary{cursor:pointer;font-size:.72rem;font-weight:700;color:#b5262c;text-align:center}
details.culture p{margin:4px 0 0;font-size:.72rem;line-height:1.5;color:var(--ink)}
.item.book.atayal{border-color:#e7b4a8}
.season{border-color:var(--sun);background:linear-gradient(var(--gold-soft),var(--surface) 90px)}
.season.off{background:var(--surface);border-color:var(--line)}
.season-in{display:flex;flex-direction:column;gap:10px}
.season-items{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.s-item{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-weight:700;font-size:.85rem}
.s-item .av{width:64px;height:64px}
.s-item small{font-weight:500;color:var(--muted);font-size:.7rem}
.s-item.got .av{box-shadow:0 0 0 3px var(--ok)}

.achieve{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-radius:18px;padding:14px;color:#fff;
  background:repeating-linear-gradient(135deg,#b5262c 0 14px,#9e1f25 14px 16px);box-shadow:inset 0 0 0 3px #f2c14e}
.achieve-avs{display:flex;gap:6px}.achieve .av{width:64px;height:64px;box-shadow:0 0 0 3px #fff}
.achieve>div:last-child{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.achieve strong{font-family:var(--round);font-weight:400;font-size:1.15rem}
.achieve p{margin:0;font-size:.88rem;opacity:.95}

/* learning modes */
.learn-tabs .view-tab{font-size:.98rem;padding:8px 4px}
@media (max-width:440px){.learn-tabs .view-tab{font-size:.86rem}}
.chip-btn.on{background:var(--accent);color:var(--on-accent)}
.fc-card{position:relative;min-height:260px;border-radius:22px;border:2px solid var(--line);background:var(--surface);box-shadow:0 6px 0 var(--line);
  display:flex;align-items:center;justify-content:center;padding:44px 20px 36px;cursor:pointer;text-align:center;
  background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--accent) 12%,transparent) 31px 32px)}
.fc-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.fc-card.flipped{border-color:var(--accent);animation:flipIn .35s ease}
@keyframes flipIn{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.fc-face{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.fc-word{font-family:"Baloo 2",var(--body);font-weight:800;font-size:clamp(2.2rem,9vw,3rem);line-height:1.1;color:var(--accent);word-break:break-word}
.fc-zh{font-family:var(--round);font-size:1.7rem}
.fc-ex{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:14px;padding:8px 12px;max-width:34rem;text-align:left}
.fc-ex .tap-sent{margin:0}
.fc-spk{position:absolute;top:10px;right:10px}
.fc-left{position:absolute;top:16px;left:16px}
.fc-acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-choice{flex-direction:column;gap:0!important;padding:12px!important}
.big-choice b{font-family:var(--round);font-weight:400;font-size:1.2rem}
.big-choice span{font-size:.8rem;font-weight:500;opacity:.8}
.big-choice.again{border-color:var(--bad);color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.big-choice.know{border-color:var(--ok);background:var(--ok);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.match-grid{grid-template-columns:repeat(3,1fr)}}
.tile{font:inherit;min-height:74px;padding:8px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line);word-break:break-word;line-height:1.3;transition:transform .12s,opacity .3s}
.tile.en{font-family:"Baloo 2",var(--body);font-weight:700;font-size:1.05rem}
.tile.zh{font-family:var(--round);font-size:1rem;background:var(--sunk)}
.tile:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.tile.done{opacity:.25;border-color:var(--ok);background:var(--ok-soft);cursor:default;box-shadow:none}
.ap-card{min-height:240px;border-radius:22px;background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 18px;text-align:center}
.ap-word{font-family:"Baloo 2",var(--body);font-weight:800;font-size:clamp(2.4rem,10vw,3.4rem);line-height:1.05;color:var(--accent);word-break:break-word}
.ap-zh{font-family:var(--round);font-size:1.6rem;transition:opacity .3s}
.ap-ex{display:flex;flex-direction:column;gap:2px;max-width:34rem;transition:opacity .3s}
.ap-ex .tap-sent{margin:0}
.ap .hide{opacity:0}
.ap-ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.ap-main{font-size:1.15rem!important}
.ap-ctrl .btn{white-space:nowrap;padding:10px 6px}
.ap-opt{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:700;cursor:pointer}
.ap-opt input{width:18px;height:18px;accent-color:var(--accent)}

/* reward + send */
.reward{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold-soft);border:2px solid var(--sun);border-radius:18px;padding:12px 14px}
.reward svg{width:42px;height:42px;color:var(--gold);flex:none}
.reward div{flex:1;min-width:160px;display:flex;flex-direction:column}
.reward strong{font-family:var(--round);font-weight:400;font-size:1.15rem;color:var(--gold)}
.send{border:2px solid var(--accent);background:var(--accent-soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.send-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.send-head .av{width:44px;height:44px}
.send-txt{display:flex;flex-direction:column;flex:1;min-width:140px}
.send-txt strong{font-family:var(--round);font-weight:400;font-size:1.15rem}
.send-main{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.big-submit{font-size:1.15rem!important;padding:13px 18px!important}
.more summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:700}
.more[open]{display:flex;flex-direction:column;gap:10px}
.more textarea{min-height:150px;margin-top:8px}
.hist{display:flex;flex-direction:column}
.hist-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:2px dashed var(--line)}
.hist-row:first-child{border-top:0}
.hist-info{display:flex;flex-direction:column;min-width:0}
.note{background:var(--sunk);border-radius:14px;padding:10px 14px;font-size:.88rem;color:var(--muted);margin:0}
nav button{white-space:nowrap}
@media (max-width:440px){nav button{font-size:.92rem;padding:8px 2px}}

const TYPES={

  meaning:{name:"看中文選英文",pts:15,lv:2,desc:"看中文意思，選出對應的英文單字"},
  speak:{name:"念出單字",pts:20,lv:3,desc:"看單字念出來，用語音辨識判斷對錯，每題 3 次機會"},

};
/* 課本單字：康軒國中英語 八上 L3–L6 單字例句小考卷 */
const LESSONS=[{"id":"L3","name":"第 3 課","words":[{"w":"chicken","m":"雞","x":"Mr. Jones keeps some chickens for their eggs.","t":"Jones 先生養了一些雞來生蛋。","a":"chickens"},{"w":"ant","m":"螞蟻","x":"There are many ants around the sugar.","t":"糖周圍有很多螞蟻。","a":"ants"},{"w":"ugly","m":"醜的","x":"Many people don’t buy ugly fruits. In fact, they are delicious.","t":"很多人不買長相醜的水果。事實上，它們很美味。","a":"ugly"},{"w":"duck","m":"鴨子","x":"Doris: Where are the noises from? Paul: They’re from the ducks in the pond.","t":"Doris：這些噪音是從哪裡來的？ Paul：是池塘裡的鴨子發出來的。","a":"ducks"},{"w":"goose","m":"鵝（複數 geese）","x":"Terry: What are those birds in the lake? Are they ducks? Hebe: No, they are geese.","t":"Terry：湖裡的那些是什麼鳥？牠們是鴨子嗎？ Hebe：不，牠們是鵝。","a":"geese"},{"w":"frog","m":"青蛙","x":"A frog usually lives near water and moves by jumping.","t":"青蛙通常生活在水邊並透過跳躍來移動。","a":"frog"},{"w":"cow","m":"母牛","x":"The farmer has twenty cows and thirty pigs on his farm.","t":"這位農夫的農場裡有二十頭母牛和三十頭豬。","a":"cows"},{"w":"map","m":"地圖","x":"Nancy is bad at reading maps. She can’t find her ways often.","t":"Nancy 不擅長看地圖。她經常找不到自己的路。","a":"maps"},{"w":"beginning","m":"開始；開端","x":"In the beginning, I didn’t like Calvin. But now, we are good friends.","t":"一開始，我不喜歡 Calvin。但是現在我們是好朋友。","a":"beginning"},{"w":"middle","m":"中間","x":"There is a big round table in the middle of the dining room.","t":"餐廳中間有一張大圓桌。","a":"middle"},{"w":"quarter","m":"一刻鐘（十五分鐘）；四分之一","x":"It’s a quarter to twelve. Let’s meet 15 minutes later and have lunch together.","t":"現在是十一點四十五分。我們 15 分鐘後見面，一起吃午餐。","a":"quarter"},{"w":"along","m":"沿著","x":"Jamie takes a walk along the river after dinner every day.","t":"Jamie 每天晚餐後都會沿著河邊散步。","a":"along"},{"w":"clear","m":"晴朗的；清楚的","x":"The weather is warm, and the sky is clear.","t":"天氣溫暖，天空晴朗。","a":"clear"},{"w":"pass","m":"經過","x":"Pearl said hi when she passed our house.","t":"Pearl 經過我們家時向我們打招呼。","a":"passed"},{"w":"forest","m":"森林","x":"There are a lot of trees in the forest. The air there is very clean.","t":"森林裡有很多樹。那裡的空氣非常清新。","a":"forest"},{"w":"dry","m":"乾燥的","x":"The weather is dry in Sydney in winter. They don’t have much rain.","t":"雪梨的冬季天氣乾燥。不太下雨。","a":"dry"},{"w":"something","m":"某事；某物","x":"There must be something wrong with the air con. It’s really hot here.","t":"空調肯定有問題。這裡真的很熱。","a":"something"},{"w":"jar","m":"罐子","x":"Mom: Help me put the rice into the jar, Jack. Jack: OK, Mom.","t":"Mom：Jack，幫我把米放入罐子。 Jack：好的，媽媽。","a":"jar"},{"w":"beak","m":"鳥嘴","x":"Birds use their beaks to pick up food.","t":"鳥用牠們的鳥嘴取食。","a":"beaks"},{"w":"reach","m":"伸手；到達","x":"Tony reached into his bag and took out his cellphone.","t":"Tony 將手伸進他的袋子並拿出他的手機。","a":"reached"},{"w":"rock","m":"岩石","x":"You can see many rocks at the beach.","t":"你可以在海灘上看到許多岩石。","a":"rocks"},{"w":"fly","m":"飛","x":"The poor bird couldn’t fly because it was hurt.","t":"這隻可憐的小鳥因受傷而無法飛翔。","a":"fly"},{"w":"pick up","m":"撿起","x":"Kelly picked up the clothes on the floor.","t":"Kelly 撿起地板上的衣服。","a":"picked up"},{"w":"back","m":"回到原處","x":"Rebecca went back to her room and took a rest.","t":"Rebecca 回到她的房間休息。","a":"back"},{"w":"drop","m":"掉落；使落下","x":"Andy dropped his keys on the bus on his way home.","t":"Andy 在回家的路上把鑰匙掉在公車上了。","a":"dropped"},{"w":"into","m":"進入","x":"Don’t go into my room, please.","t":"請不要進入我的房間。","a":"into"},{"w":"good job","m":"做得好","x":"Sean: Mom, my team won the baseball game today. Mom: Good job!","t":"Sean：媽媽，我的隊伍今天贏了棒球比賽。 Mom：做得好！","a":"Good job"},{"w":"be proud of","m":"以…為榮","x":"We are proud of the players on the school team.","t":"我們以校隊的運動員為榮。","a":"are proud of"},{"w":"back and forth","m":"來回地","x":"Jay walked back and forth in his room.","t":"Jay 在他的房間裡來回地走動。","a":"back and forth"},{"w":"finally","m":"最後；終於","x":"After five months, Robin finally found a job.","t":"五個月後，Robin 最後找到工作了。","a":"finally"},{"w":"top","m":"頂端","x":"The school is on the top of the mountain.","t":"這座學校位於山頂。","a":"top"},{"w":"past","m":"經過","x":"Our cat ran past me and out of the room.","t":"我們的貓從我身邊跑過，跑出了房間。","a":"past"},{"w":"finish","m":"完成","x":"Joe took a rest after he finished lunch.","t":"Joe 吃完午餐後休息了一下。","a":"finished"},{"w":"anything","m":"任何事物","x":"Is there anything special about the story?","t":"這個故事有任何特別之處嗎？","a":"anything"},{"w":"shout","m":"大叫","x":"Never shout at your parents and teachers.","t":"永遠不要對你的父母和老師大喊大叫。","a":"shout"},{"w":"joy","m":"喜悅","x":"Rosa loves exercise. She finds joy in playing sports.","t":"Rosa 熱愛運動。她從運動中找到了喜悅。","a":"joy"},{"w":"pool","m":"游泳池","x":"Daisy bought a house with a pool. She can swim in her house.","t":"Daisy 買了一棟有游泳池的房子。她可以在家裡游泳。","a":"pool"},{"w":"when","m":"當…時候","x":"Dad was cooking dinner when I opened the door.","t":"當我打開門時，爸爸正在煮晚餐。","a":"when"},{"w":"close","m":"接近的","x":"Jodie is standing close to me in the photo.","t":"Jodie 在這張照片裡站得離我很近。","a":"close"}],"builtin":true},{"id":"L4","name":"第 4 課","words":[{"w":"waiter","m":"男服務生","x":"Helen asked the waiter to bring her the menu.","t":"Helen 要求這位男服務生拿菜單給她。","a":"waiter"},{"w":"waitress","m":"女服務生","x":"The waitress is very nice to children.","t":"那位女服務生對孩子們很好。","a":"waitress"},{"w":"housewife","m":"家庭主婦","x":"Being a housewife isn’t easy for me.","t":"對我來說，當家庭主婦並不容易。","a":"housewife"},{"w":"mailman","m":"郵差","x":"Ted is a mailman. He is proud of his job.","t":"Ted 是一位郵差。他對他的工作感到驕傲。","a":"mailman"},{"w":"police officer","m":"警察","x":"The police officer helped the kid find his way home.","t":"警察幫助那個小孩找到回家的路。","a":"police officer"},{"w":"secretary","m":"祕書","x":"Ivy’s secretary helps her with a lot of things every day.","t":"Ivy 的祕書每天協助她很多事情。","a":"secretary"},{"w":"factory worker","m":"工廠工人","x":"Hank is a factory worker. He works at a car factory.","t":"Hank 是一名工廠工人。他在一家汽車工廠工作。","a":"factory worker"},{"w":"actor","m":"男演員","x":"Elvis was a worker before. However, he is an actor now.","t":"Elvis 以前是一名工人。不過，他現在是一名演員。","a":"actor"},{"w":"actress","m":"女演員","x":"Peggy is good at acting. Being an actress is her dream.","t":"Peggy 擅長表演。當女演員是她的夢想。","a":"actress"},{"w":"reporter","m":"記者","x":"Meg plans to be a sports reporter in the future.","t":"Meg 計畫在未來當一名體育記者。","a":"reporter"},{"w":"singer","m":"歌手","x":"The singer is good at English songs.","t":"那名歌手擅長英文歌曲。","a":"singer"},{"w":"writer","m":"作家","x":"Samuel wants to be a writer of children’s books.","t":"Samuel 想成為兒童書作家。","a":"writer"},{"w":"music","m":"音樂","x":"Please be quiet. I’m listening to music.","t":"請安靜。我正在聽音樂。","a":"music"},{"w":"guitar","m":"吉他","x":"Tom can play the guitar.","t":"Tom 會彈吉他。","a":"guitar"},{"w":"drum","m":"鼓","x":"Jessica learned to play the drums when she was ten.","t":"Jessica 十歲時就學會打鼓了。","a":"drums"},{"w":"future","m":"未來","x":"Oliver wants to be a police officer in the future.","t":"Oliver 未來想當一名警察。","a":"future"},{"w":"interesting","m":"有趣的","x":"The movie is interesting. I like it a lot.","t":"這部電影很有趣。我非常喜歡它。","a":"interesting"},{"w":"camera","m":"相機","x":"Vicky bought a camera for her father yesterday.","t":"Vicky 昨天買了一臺相機給她爸爸。","a":"camera"},{"w":"important","m":"重要的","x":"Having enough sleep is important for everyone.","t":"有充足的睡眠對每一個人都很重要。","a":"important"},{"w":"popular","m":"受歡迎的","x":"The YouTuber is popular with housewives.","t":"這位 YouTuber 深受家庭主婦的喜愛。","a":"popular"},{"w":"gift","m":"天分；禮物","x":"Darren has a gift for music.","t":"Darren 有音樂天分。","a":"gift"},{"w":"tell","m":"告訴；講述","x":"Can you tell us about your school life in the UK?","t":"你可以跟我們講講你在英國的學校生活嗎？","a":"tell"},{"w":"funny","m":"好笑的","x":"The video is funny. Let’s watch it again.","t":"這個影片很好笑。我們再看一次吧。","a":"funny"},{"w":"plan","m":"計畫","x":"We plan to visit Hualien next weekend.","t":"我們計畫下週末造訪花蓮。","a":"plan"},{"w":"star","m":"明星","x":"Emma Stone is a popular movie star.","t":"Emma Stone 是一位受歡迎的電影明星。","a":"star"},{"w":"without","m":"沒有","x":"You can’t work for six hours without taking a break.","t":"你不能連續工作六個小時不休息。","a":"without"},{"w":"dream","m":"夢","x":"I had a bad dream last night. It was terrible.","t":"我昨晚做了一個惡夢。真是太可怕了。","a":"dream"},{"w":"teenager","m":"青少年","x":"Mr. and Mrs. Wu’s son is fourteen. He is a teenager.","t":"吳氏夫婦的兒子十四歲。他是一位青少年。","a":"teenager"},{"w":"exciting","m":"令人興奮的","x":"Playing video games is exciting for teenagers.","t":"玩電玩遊戲對青少年來說是一件令人興奮的事情。","a":"exciting"},{"w":"fight","m":"打鬥；對抗","x":"Pro gamers have to look for new ways to fight different players.","t":"專業玩家必須尋找新方法對抗不同的玩家。","a":"fight"},{"w":"one another","m":"彼此","x":"We share our stories with one another.","t":"我們彼此分享自己的故事。","a":"one another"},{"w":"money","m":"錢","x":"David lost his money on his way to school.","t":"David 在上學途中掉了錢。","a":"money"},{"w":"famous","m":"有名的","x":"Kenting is famous for its beautiful beaches.","t":"墾丁以它的美麗海灘聞名。","a":"famous"},{"w":"train","m":"訓練","x":"Alice is training her dog to sit.","t":"Alice 正在訓練她的狗坐下。","a":"training"},{"w":"sadly","m":"令人遺憾地","x":"Sadly, Tony lost his job last week.","t":"令人遺憾地，Tony 上週失去了他的工作。","a":"Sadly"},{"w":"team up with","m":"和…組隊","x":"Sharon is good at basketball. Let’s team up with her.","t":"Sharon 擅長籃球。我們和她組隊吧。","a":"team up with"},{"w":"have to","m":"必須","x":"I have to take care of my little sister tonight because my parents aren’t home.","t":"我今晚必須照顧我的妹妹，因為我父母不在家。","a":"have to"},{"w":"stay up","m":"熬夜","x":"Don’t stay up playing video games. It’s bad for your eyes.","t":"不要熬夜玩電玩遊戲。那對你的眼睛不好。","a":"stay up"}],"builtin":true},{"id":"L5","name":"第 5 課","words":[{"w":"temple","m":"寺廟","x":"My grandma goes to the temple every week.","t":"我奶奶每週去那間寺廟。","a":"temple"},{"w":"supermarket","m":"超級市場","x":"We’re going to buy some food at the supermarket this afternoon.","t":"我們今天下午將會去超級市場買一些食物。","a":"supermarket"},{"w":"restaurant","m":"餐廳","x":"Let’s have dinner at the restaurant.","t":"我們在那間餐廳吃晚餐吧。","a":"restaurant"},{"w":"bank","m":"銀行","x":"We have little money in the bank.","t":"我們銀行裡沒什麼錢。","a":"bank"},{"w":"church","m":"教堂","x":"Lucy: Do you go to church? Fred: Yes, I go to church every Sunday.","t":"Lucy：你去教堂做禮拜嗎？ Fred：是的，我每星期日去教堂做禮拜。","a":"church"},{"w":"bakery","m":"麵包店","x":"Mrs. Taylor runs a bakery with her sister.","t":"Taylor 太太和她的妹妹經營一間麵包店。","a":"bakery"},{"w":"bridge","m":"橋","x":"Cross the bridge, and you’ll see me by the river.","t":"跨越這座橋，你會在河邊看見我。","a":"bridge"},{"w":"hotel","m":"飯店","x":"They checked in at the hotel after 3 p.m. yesterday.","t":"他們昨天下午三點後入住那間飯店。","a":"hotel"},{"w":"department store","m":"百貨公司","x":"Julia often buys clothes in department stores.","t":"Julia 時常在百貨公司買衣服。","a":"department stores"},{"w":"metro station","m":"捷運站","x":"Kathy: Don’t run in the metro station, Vicky. Vicky: I’m sorry.","t":"Kathy：Vicky，不要在捷運站裡奔跑。 Vicky：我很抱歉。","a":"metro station"},{"w":"bookstore","m":"書店","x":"I often buy books in that bookstore.","t":"我經常在那間書店買書。","a":"bookstore"},{"w":"post office","m":"郵局","x":"Mrs. Lin went to the post office and sent a letter to her friend in the USA.","t":"林太太到郵局寄信給她在美國的朋友。","a":"post office"},{"w":"flower shop","m":"花店","x":"Todd loves flowers. He is going to run a flower shop in the future.","t":"Todd 喜愛花。他未來將會經營一間花店。","a":"flower shop"},{"w":"trip","m":"旅行","x":"They will take a trip to Taitung next weekend.","t":"他們下個週末要去臺東旅行。","a":"trip"},{"w":"during","m":"在…期間","x":"You can go to the restroom during the break.","t":"你可以在休息時間去洗手間。","a":"during"},{"w":"vacation","m":"假期","x":"The Lin family went on vacation last month.","t":"林家人上個月去度假。","a":"vacation"},{"w":"will","m":"將會（否定 won't）","x":"George: Will you help me with my homework? William: No, I won’t.","t":"George：你將協助我做回家作業嗎？ William：不，我不會。","a":"Will won’t"},{"w":"own","m":"自己的","x":"I like living on my own.","t":"我喜歡獨自生活。","a":"own"},{"w":"local","m":"當地的","x":"My mom works at the local supermarket.","t":"我媽媽在那間當地的超級市場工作。","a":"local"},{"w":"tour","m":"旅遊行程","x":"We plan to join the local tour in Bangkok.","t":"我們計畫參加曼谷當地的旅遊行程。","a":"tour"},{"w":"spend","m":"花費（時間、金錢）","x":"Maggie spent half an hour walking to the bakery.","t":"Maggie 花了半小時走到那間麵包店。","a":"spent"},{"w":"thousand","m":"一千","x":"Ivy spent two thousand NT dollars on the coat.","t":"Ivy 花了新臺幣兩千元買那件大衣。","a":"thousand"},{"w":"each","m":"每個","x":"Each child can get a toy car for free.","t":"每個孩子可以免費得到一臺玩具車。","a":"Each"},{"w":"pay","m":"付錢","x":"I paid one thousand NT dollars for this cellphone.","t":"我付了新臺幣一千元買這支手機。","a":"paid"},{"w":"tomorrow","m":"明天","x":"Mandy and I are going to visit Mr. Jones tomorrow.","t":"Mandy 和我明天要去拜訪 Jones 先生。","a":"tomorrow"},{"w":"almost","m":"幾乎","x":"It was almost two o’clock when Eric left.","t":"Eric 離開時幾乎是兩點了。","a":"almost"},{"w":"decide","m":"決定","x":"It was raining then, so we decided to stay at the hotel.","t":"當時正在下雨，所以我們決定住在飯店。","a":"decided"},{"w":"cost","m":"花費（金額）","x":"It cost me five thousand NT dollars to buy the guitar.","t":"買這把吉他花了我新臺幣五千元。","a":"cost"},{"w":"fan","m":"迷；粉絲","x":"Terry is a big fan of baseball.","t":"Terry 是棒球迷。","a":"fan"},{"w":"leave for","m":"動身前往","x":"Jenny and Paul are going to leave for Tokyo tomorrow. They will stay there for a week.","t":"Jenny 和 Paul 明天要前往東京。他們將在那裡待一星期。","a":"leave for"},{"w":"vendor","m":"小販","x":"There are some flower vendors outside the temple.","t":"廟的外面有一些賣花的攤販。","a":"vendors"},{"w":"quick","m":"迅速的","x":"I tried to catch her, but she was too quick for me.","t":"我試著抓住她，但對我而言她太迅速了。","a":"quick"},{"w":"stall","m":"攤位","x":"Jason runs a fruit stall in the market.","t":"Jason 在市場經營一個水果攤。","a":"stall"},{"w":"careful","m":"小心的","x":"Be careful! There is a car behind you.","t":"小心！你後面有一臺車。","a":"careful"},{"w":"boat","m":"船","x":"Mr. Simpson has two fishing boats.","t":"Simpson 先生有兩艘漁船。","a":"boats"},{"w":"sell","m":"賣","x":"I sold my bag to Jamie for NT$100.","t":"我把我的包包以新臺幣一百元賣給 Jamie。","a":"sold"},{"w":"low","m":"低的","x":"Our office is in a low building.","t":"我們的辦公室在一棟低矮的建築物裡。","a":"low"},{"w":"price","m":"價格","x":"Bill sold his house at a high price.","t":"Bill 以高價賣出他的房子。","a":"price"},{"w":"remember","m":"記得","x":"Remember to send me a message when you get home.","t":"當你到家時，記得傳個訊息給我。","a":"Remember"},{"w":"cash","m":"現金","x":"Do you have any cash on you?","t":"你身上有任何現金嗎？","a" corner","m":"轉角","x":"The bank is on the corner of Sun Street and Star Road.","t":"那家銀行在 Sun 街和 Star 路的轉角。","a":"corner"},{"w":"straight","m":"直直地","x":"Go straight for two blocks and turn right at the bookstore.","t":"直走兩個街區並在書店右轉。","a":"straight"},{"w":"block","m":"街區","x":"The supermarket is three blocks away.","t":"那間超級市場離這裡有三個街區。","a":"blocks"},{"w":"across from","m":"在…對面","x":"The flower shop is across from the post office.","t":"那間花店在郵局對面。","a":"across from"},{"w":"bottom","m":"底部","x":"I finally found my key at the bottom of my bag.","t":"我終於在袋子的底部找到我的鑰匙。","a":"bottom"},{"w":"rule","m":"規定","x":"Rules are rules. Go to bed now.","t":"規定就是規定。現在上床睡覺。","a":"Rules rules"},{"w":"broken","m":"破掉的","x":"Be careful. There’s broken glass on the floor.","t":"小心。地板上有破玻璃。","a":"broken"},{"w":"shake hands","m":"握手","x":"Mr. White shook hands with the famous writer.","t":"White 先生跟那位有名的作家握了手。","a":"shook hands"},{"w":"favorite","m":"最喜愛的","x":"The basketball court is their favorite place at school.","t":"那個籃球場是他們在學校最喜愛的地方。","a":"favorite"},{"w":"pocket","m":"口袋","x":"Linda took out the money from her pocket.","t":"Linda 從她的口袋拿出錢。","a":"pocket"},{"w":"monster","m":"怪獸","x":"The movie is about a yellow monster. Kids love it very much.","t":"這部電影是關於一隻黃色的怪獸。孩子們非常愛牠。","a":"monster"},{"w":"clerk","m":"店員","x":"Jeff works as a clerk in a shoe store.","t":"Jeff 在一間鞋店當店員。","a":"clerk"},{"w":"convenient","m":"方便的","x":"The metro station is only one block from my place. It’s very convenient for me to walk there.","t":"捷運站離我家只有一個街區。我走路到那裡非常方便。","a":"convenient"},{"w":"mistake","m":"錯誤","x":"I made a mistake. I sent the mail to the wrong person.","t":"我犯了一個錯誤。我把那封信寄給錯的人了。","a":"mistake"},{"w":"parking space","m":"停車位","x":"Debbie spent one hour waiting for a parking space.","t":"Debbie 花了一小時等一個停車位。","a":"parking space"},{"w":"visitor","m":"遊客","x":"There are many visitors in Taipei 101.","t":"臺北 101 有很多遊客。","a":"visitors"},{"w":"cheap","m":"便宜的","x":"My bike was cheap. It only cost me eight hundred NT dollars.","t":"我的腳踏車很便宜。它只花了我新臺幣八百元。","a":"cheap"},{"w":"beef","m":"牛肉","x":"Mike: Let’s eat beef rice for lunch. Gary: Sorry, but I don’t eat beef.","t":"Mike：我們午餐吃牛肉飯吧。 Gary：抱歉，但我不吃牛肉。","a":"beef"}],"builtin":true}];

  const gname=GRADES.find(g=>g.id===S.grade).name;const gs=gradeSets(S.grade);

    h("div",{},h("strong",{text:s.name}),h("div",{class:"small muted"},`${s.words.length} 個單字${s.id==="mixall"?"・自動整理":s.builtin?"・課本內建":"・自己匯入"}`,curSet()&&s.id===curSet().id?h("span",{class:"current",text:"　· 使用中"}):null)),
    h("div",{class:"row"},
      !(curSet()&&s.id===curSet().id)?h("button",{class:"btn",text:"使用",onclick:()=>{S.cur=s.id;quiz=null;save();render()}}):null,
      !s.builtin?h("button",{class:"btn danger",text:pendingDelete===s.id?"確定刪除？":"刪除",onclick:()=>{
        if(pendingDelete!==s.id){pendingDelete=s.id;render();return}
        S.sets=S.sets.filter(x=>x.id!==s.id);pendingDelete=null;quiz=null;save();render();toast("已刪除單字集")}}):null)))):h("p",{class:"muted",text:"這個年級還沒有單字集，可以在下面匯入。"});
  const gsel=h("select",{id:"setGrade"},...GRADES.map(g=>h("option",{value:g.id,selected:g.id===S.grade,text:g.name+(g.id==="1200"?"綜合練習":"")})));
  const name=h("input",{id:"setName",placeholder:"例如：英文第三課"});
  const ta=h("textarea",{id:"setText",placeholder:"apple,蘋果,I eat an apple every day.\nbrave,勇敢的,She is very brave."});
  const info=h("span",{class:"small muted"});
  ta.addEventListener("input",()=>{const n=parse(ta.value).length;info.textContent=ta.value.trim()?`讀到 ${n} 個單字`:""});
  const file=h("input",{type:"file",accept:".csv,.txt,.tsv",hidden:true,id:"setFile",onchange:e=>{const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{ta.value=r.result;if(!name.value)name.value=f.name.replace(/\.[^.]+$/,"");ta.dispatchEvent(new Event("input"))};r.readAsText(f,"utf-8")}});
  return h("div",{style:"display:flex;flex-direction:column;gap:18px"},
    h("section",{class:"panel"},h("h2",{text:`${gname}的單字集`}),list),
    h("section",{class:"panel"},
      h("h2",{text:"匯入其他單字集"}),
      h("p",{class:"small muted",text:"七年級第 1–6 課、八年級第 3–6 課、九年級第 1–6 課已經內建。其他課或補充單字可以在這裡匯入，並選擇要放在哪個年級。"}),
      h("p",{class:"small muted",text:"一行一個單字，依序是「英文, 中文, 例句」，例句可以不填。也可以直接從 Excel 或 Google 試算表複製三欄貼上。"}),
      h("pre",{class:"format",text:"curious,好奇的,Cats are curious about everything.\nlibrary,圖書館,I study in the library after school.\nbrave,勇敢的"}),
      h("div",{class:"two"},h("label",{class:"field"},"單字集名稱",name),h("label",{class:"field"},"放在哪個年級",gsel)),
      h("label",{class:"field"},"單字內容",ta),
      h("div",{class:"row spread"},
        h("div",{class:"row"},h("label",{class:"btn",for:"setFile"},"選擇檔案（.csv / .txt）",file),info),
        h("button",{class:"btn primary",text:"匯入",onclick:()=>{
          const words=parse(ta.value);if(!words.length){toast("沒有讀到單字，請確認每行用逗號分開英文和中文");return}
          const id="s"+Date.now();S.sets.push({id,grade:gsel.value,name:name.value.trim()||`自訂單字集 ${S.sets.length+1}`,words});S.grade=gsel.value;S.cur=id;quiz=null;save();
          toast(`已匯入 ${words.length} 個單字`);tab="learn";render()}}))))}

render();
if(P()&&P().pinH)syncDown();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&P()&&P().pinH&&!(quiz&&!quiz.done))syncDown()});
</script>
</body></html>
